# ホストの journald の保存期間。seiran 本体の動作ログ（docker-compose.yml の logging）を
# 14日分残す。journald の設定はホスト全体に効くので、ホスト自身のログも14日で消える。
# 容量の上限（SystemMaxUse）は既定（ファイルシステムの10%、最大4GB）のまま。
# 本体のログは1日あたり20MB前後なので、14日分でも上限には届かない。
#
# 入れ方（root が必要）:
#   sudo install -D -m 644 docker/journald/seiran.conf /etc/systemd/journald.conf.d/seiran.conf
#   sudo systemctl reload systemd-journald（Type=notify-reload なので止めずに読み直す）
[Journal]
Storage=persistent
MaxRetentionSec=14day
